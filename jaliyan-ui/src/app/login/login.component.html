<div class="login-page">
  <div class="login-container">
    <div class="login-card-wrapper">
      <mat-card class="login-card mat-elevation-z8">
        <div class="login-logo">
          <img src="../../assets/images/Logo_old.jpg" alt="Logo" />
        </div>
<!-- 
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Sign in to continue to your dashboard</p> -->

        <form (ngSubmit)="onLogin()" #loginForm="ngForm" autocomplete="off">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Username</mat-label>
            <input
              matInput
              name="username"
              [(ngModel)]="username"
              required
              #usernameModel="ngModel"
            />
            <mat-error *ngIf="usernameModel.invalid && usernameModel.touched">
              Username is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input
              matInput
              type="password"
              name="password"
              [(ngModel)]="password"
              required
              #passwordModel="ngModel"
            />
            <mat-error *ngIf="passwordModel.invalid && passwordModel.touched">
              Password is required
            </mat-error>
          </mat-form-field>
<!-- 
          <div class="login-options">
            <mat-checkbox [(ngModel)]="rememberMe" name="rememberMe">
              Remember Me
            </mat-checkbox>
            <a class="forgot-password" routerLink="/forgot-password">
              Forgot Password?
            </a>
          </div> -->

          <button
            mat-raised-button
            color="primary"
            class="login-button"
            type="submit"
            [disabled]="loading || loginForm.invalid"
          >
            <mat-progress-spinner
              *ngIf="loading"
              diameter="20"
              mode="indeterminate"
              color="accent"
              class="spinner"
            ></mat-progress-spinner>
            <span *ngIf="!loading">Login</span>
          </button>
        </form>

        <div class="login-footer">
          <span>© 2025 Shree Jalaram Padyatra. All rights reserved.</span>
        </div>
      </mat-card>
    </div>

    <div class="login-illustration">
      <img src="../../assets/images/login-illustration.svg" alt="Illustration" />
    </div>
  </div>
</div>
