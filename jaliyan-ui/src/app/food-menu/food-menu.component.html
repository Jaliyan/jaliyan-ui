<mat-sidenav-container class="drawer-container">
  <mat-sidenav-content>
    <div class="page-wrapper">
      <h2 class="title">
        <!-- <mat-icon>restaurant</mat-icon> -->
        Manage Food Items
      </h2>

      <!-- Filter + Add Button -->
      <div class="action-bar">
        <mat-form-field appearance="fill" class="filter-field">
          <mat-label>Filter items</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Enter keyword" />
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="openDrawer()">+ Add Item</button>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            <td mat-cell *matCellDef="let element">{{ element.description }}</td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button color="primary" (click)="editItem(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteItem(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          <tr class="mat-row" *matNoDataRow>
  <td class="mat-cell" colspan="3">No food items found.</td>
</tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
      </div>
    </div>
  </mat-sidenav-content>

  <!-- Drawer -->
  <mat-sidenav #drawer position="end" mode="over" class="drawer">
    <div class="drawer-content">
      <h3>{{ isEditMode ? 'Update Item' : 'Add New Item' }}</h3>
      <form #form="ngForm" (ngSubmit)="isEditMode ? updateItem(form) : addItem(form)">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Item Name</mat-label>
          <input matInput name="name" [(ngModel)]="newItem.name" required />
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Description</mat-label>
          <input matInput name="description" [(ngModel)]="newItem.description" required />
        </mat-form-field>

        <div class="btn-group">
          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
            {{ isEditMode ? 'Update' : 'Add' }}
          </button>
          <button mat-stroked-button type="button" (click)="closeDrawer()">Cancel</button>
        </div>
      </form>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
