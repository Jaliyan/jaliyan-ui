<mat-sidenav-container class="drawer-container">
  <mat-sidenav-content>
    <div class="page-wrapper">

      <!-- Page header -->
      <div class="page-header">
        <div class="heading">
          <span class="eyebrow">{{ 'ShreeJalaramPadyatra' | translate }}</span>
          <h2 class="title">Manage Food Items</h2>
        </div>
        <button mat-flat-button class="btn-add" (click)="openDrawer()">
          <mat-icon>add</mat-icon> Add Item
        </button>
      </div>

      <!-- Reusable data grid -->
      <app-data-grid
        [data]="items"
        [columns]="columns"
        searchPlaceholder="Filter items"
        [actionsTemplate]="rowActions">
      </app-data-grid>

      <!-- Row / card actions (projected into the grid) -->
      <ng-template #rowActions let-el>
        <div class="row-actions">
          <button mat-icon-button class="icon-btn act-edit" (click)="editItem(el); $event.stopPropagation()" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button class="icon-btn act-delete" (click)="deleteItem(el); $event.stopPropagation()" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </ng-template>

    </div>
  </mat-sidenav-content>

  <!-- Add / Edit drawer -->
  <mat-sidenav #drawer position="end" mode="over" class="drawer">
    <div class="drawer-content">
      <div class="drawer-head">
        <span class="drawer-icon"><mat-icon>{{ isEditMode ? 'edit' : 'restaurant_menu' }}</mat-icon></span>
        <h3>{{ isEditMode ? 'Update Item' : 'Add New Item' }}</h3>
      </div>

      <form #form="ngForm" (ngSubmit)="isEditMode ? updateItem(form) : addItem(form)">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Item Name</mat-label>
          <input matInput name="name" [(ngModel)]="newItem.name" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <input matInput name="description" [(ngModel)]="newItem.description" required />
        </mat-form-field>

        <div class="btn-group">
          <button mat-flat-button class="btn-save" type="submit" [disabled]="form.invalid">
            <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
            {{ isEditMode ? 'Update' : 'Add' }}
          </button>
          <button mat-button class="btn-cancel" type="button" (click)="closeDrawer()">Cancel</button>
        </div>
      </form>
    </div>
  </mat-sidenav>
</mat-sidenav-container>
