<div class="dashboard-wrapper">
  <h1 class="dashboard-header">ભોજન કાર્યક્રમ</h1>

  <ng-container *ngIf="loading">
    <p class="loading">લોડ થઇ રહ્યું છે...</p>
  </ng-container>

  <ng-container *ngIf="!loading && error">
    <p class="error">{{ error }}</p>
  </ng-container>

  <ng-container *ngIf="!loading && !error">
    <mat-accordion multi>
      <mat-expansion-panel *ngFor="let day of itinerary">
        <mat-expansion-panel-header>
          <mat-panel-title class="date-header">
            {{ day.date }}
          </mat-panel-title>
        </mat-expansion-panel-header>

        <table class="dashboard-table" role="table" [attr.aria-label]="'ભોજન કાર્યક્રમ માટે ' + day.date">
          <thead>
            <tr>
              <th>ભોજન પ્રકાર</th>
              <th>મેનુ</th>
              <th>સ્થળ</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let meal of day.meals">
              <td data-label="ભોજન પ્રકાર">{{ meal.type }}</td>
              <td data-label="મેનુ">
                <ng-container *ngIf="meal.menu?.length; else noMenu">
                  {{ meal.menu.join(', ') }}
                </ng-container>
                <ng-template #noMenu>મેનુ ઉપલબ્ધ નથી</ng-template>
              </td>
              <td data-label="સ્થળ">
                <ng-container *ngIf="meal.location; else noLocation">
                  <!-- <a href="https://www.google.com/maps/search/?api=1&query={{ meal.location.lat }},{{ meal.location.lng }}" target="_blank" rel="noopener">
                    {{ meal.location.name }}
                  </a> -->
                  <a [href]="meal.location.mapUrl" target="_blank" rel="noopener">
                    {{ meal.location.name }}
                  </a>
                </ng-container>
                <ng-template #noLocation>સ્થળ ઉપલબ્ધ નથી</ng-template>
              </td>
            </tr>
          </tbody>
        </table>
      </mat-expansion-panel>
    </mat-accordion>
  </ng-container>
</div>
