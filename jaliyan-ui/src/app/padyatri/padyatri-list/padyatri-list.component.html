<mat-sidenav-container class="drawer-container">
  <mat-sidenav-content>
    <div class="page-wrapper">
      <h2 class="title">Padyatri List</h2>

      <!-- Action Bar -->
      <div class="action-bar">
        <div class="button-group">
          <button mat-raised-button color="primary" routerLink="/padyatri/add" style="color: #f57c00">
            <mat-icon>person_add</mat-icon> Add New Padyatri
          </button>

          <button mat-raised-button color="primary" (click)="downloadBulkIDCards()"
            [disabled]="selectedPadyatris.length === 0" style="margin-left: 8px; color: #f57c00">
            <mat-icon>download</mat-icon>Download Selected ID Cards
          </button>
        </div>

        <mat-form-field appearance="fill" class="filter-field">
          <mat-label>Search</mat-label>
          <input matInput placeholder="Search by Batch Id" (input)="applyFilter($event)" />
        </mat-form-field>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8" style="background: #f4f6f8">
          <!-- Checkbox -->
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
              <mat-checkbox (change)="toggleAllRows($event)" [checked]="isAllSelected()"
                [indeterminate]="isSomeSelected()">
              </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
              <mat-checkbox (click)="$event.stopPropagation()" (change)="toggleRow(row)"
                [checked]="selectedPadyatris.includes(row)">
              </mat-checkbox>
            </td>
          </ng-container>

          <!-- Batch ID -->
          <ng-container matColumnDef="batchId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Batch ID</th>
            <td mat-cell *matCellDef="let padyatri">
              {{ toGujaratiDigits(padyatri.batchId) }}
            </td>
          </ng-container>

          <!-- First Name -->
          <ng-container matColumnDef="firstName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              First Name
            </th>
            <td mat-cell *matCellDef="let padyatri">{{ padyatri.firstName }} {{ padyatri.lastName }}</td>
          </ng-container>

          <!-- Mobile -->
          <ng-container matColumnDef="mobile">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Mobile</th>
            <td mat-cell *matCellDef="let padyatri">{{ padyatri.mobile }}</td>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let padyatri">
              <div class="actions">
                <button mat-icon-button color="accent" (click)="viewPadyatri(padyatri)" matTooltip="View Details">
                  <mat-icon>visibility</mat-icon>
                </button>

                <button mat-icon-button color="primary" [routerLink]="['/padyatri/edit', padyatri.padyatriId]"
                  matTooltip="Edit">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deletePadyatri(padyatri.padyatriId)" matTooltip="Delete">
                  <mat-icon>delete</mat-icon>
                </button>
                <button mat-icon-button color="primary" (click)="returnPadyatri(padyatri.padyatriId,true)"
                  *ngIf="!padyatri.isReturn" matTooltip="Mark as Returned">
                  <mat-icon>repartition</mat-icon>
                </button>

                <button mat-icon-button color="primary" (click)="returnPadyatri(padyatri.padyatriId,false)"
                  *ngIf="padyatri.isReturn" matTooltip="Mark as Active">
                  <mat-icon>how_to_reg</mat-icon>
                </button>

                <button mat-icon-button (click)="viewIDCard(padyatri)" matTooltip="View ID Card">
                  <mat-icon>assignment_ind</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              No padyatris found.
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons style="background: #f4f6f8"></mat-paginator>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<!-- Hidden Render Container for PDF -->
<div #bulkCardContainer style="position: absolute; top: 0; left: 0; opacity: 0; z-index: -1;">
  <app-id-card *ngFor="let padyatri of selectedPadyatris" [padyatri]="padyatri"></app-id-card>
</div>
