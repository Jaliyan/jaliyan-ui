<mat-sidenav-container class="drawer-container">
  <mat-sidenav-content>

    <div class="page-wrapper">

      <!-- Page header -->
      <div class="page-header">
        <div class="heading">
          <span class="eyebrow">{{ 'ShreeJalaramPadyatra' | translate }}</span>
          <h2 class="title">
            {{ 'PadyatriList' | translate }}
            <span class="count-pill">{{ toGujaratiDigits(totalCount) }} {{ 'Registered' | translate }}</span>
          </h2>
        </div>

        <button mat-flat-button class="btn-add" (click)="addNewPadyatri()">
          <mat-icon>person_add</mat-icon>
          {{ 'AddPadyatri' | translate }}
        </button>
      </div>

      <!-- Reusable data grid: search + per-column filters + sort + pagination -->
      <app-data-grid
        [data]="padyatris"
        [columns]="columns"
        [quickFilters]="quickFilters"
        [searchPredicate]="searchPredicate"
        searchPlaceholder="SearchByNameOrBatch"
        [actionsTemplate]="rowActions"
        [rowClick]="openMobile">
      </app-data-grid>

      <!-- Row / card actions (projected into the grid) -->
      <ng-template #rowActions let-p>
        <div class="row-actions">
          <button mat-icon-button class="icon-btn act-view" matTooltip="{{ 'View' | translate }}" (click)="viewPadyatri(p); $event.stopPropagation()">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button class="icon-btn act-id" matTooltip="{{ 'ViewIDCard' | translate }}" (click)="viewIDCard(p); $event.stopPropagation()">
            <mat-icon>assignment_ind</mat-icon>
          </button>
          <button mat-icon-button class="icon-btn act-edit" matTooltip="{{ 'Edit' | translate }}" (click)="editPadyatri(p); $event.stopPropagation()">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button class="icon-btn act-return" *ngIf="!p.isReturn" matTooltip="{{ 'MarkReturned' | translate }}"
            (click)="returnPadyatri(p.padyatriId, true); $event.stopPropagation()">
            <mat-icon>u_turn_left</mat-icon>
          </button>
          <button mat-icon-button class="icon-btn act-activate" *ngIf="p.isReturn" matTooltip="{{ 'Activate' | translate }}"
            (click)="returnPadyatri(p.padyatriId, false); $event.stopPropagation()">
            <mat-icon>how_to_reg</mat-icon>
          </button>
          <button mat-icon-button class="icon-btn act-delete" matTooltip="{{ 'Delete' | translate }}"
            (click)="deletePadyatri(p.padyatriId); $event.stopPropagation()">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </ng-template>

    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
